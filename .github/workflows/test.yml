name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://messenger:messenger@localhost:5433/messenger
    # Postgres for the migration + query checks.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: messenger
          POSTGRES_DB: messenger
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U messenger -d messenger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.16.0"
          rebar3-version: "3"
      - run: gleam deps download
      # Apply migrations (creates the schema) then verify the committed squirrel
      # output matches the .sql files against that schema.
      - run: gleam run -m cigogne all
      - run: gleam run -m squirrel check
      # Run the suite where tests exist, otherwise just type-check.
      - run: if [ -d test ]; then gleam test; else gleam check; fi
      - run: gleam format --check src $([ -d test ] && echo test)
